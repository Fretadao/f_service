name: Ruby

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ruby 4.0 is missing: the pinned dev dependencies (rake 13.0.1, yard,
        # simplecov) still `require 'ostruct'`, which left the stdlib in 4.0.
        # Adding it needs a dependency upgrade of its own.
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build and test with Rake
        run: bundle exec rake
      - name: Rubocop Linter Action
        run: bundle exec rubocop --parallel
