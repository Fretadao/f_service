name: Publish gem

on:
  release:
    types: [published]

permissions:
  contents: write # rubygems/release-gem may push the tag; ours already exists
  id-token: write # required for RubyGems Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # Runs `bundle exec rake release`. The Bundler tag step is a no-op here
      # (`unless already_tagged?`) because release-please already created the tag,
      # so only the RubyGems push actually happens.
      - uses: rubygems/release-gem@v1
